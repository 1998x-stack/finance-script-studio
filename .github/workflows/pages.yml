name: Validate and deploy Finance Script Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate editorial data and skills
        run: |
          python scripts/build_site.py --check
          python scripts/sync_skills.py --check
          python -m unittest discover -s tests -v
      - name: Production preflight (structural checks; not editorial approval)
        run: python scripts/qa_finance100.py --check --report _qa/finance100-review.json
      - name: Upload editorial preflight report
        uses: actions/upload-artifact@v4
        with:
          name: finance100-production-preflight
          path: _qa/finance100-review.json
          retention-days: 30
      - name: Build 100-episode production queue and pilot rehearsal kits
        run: python scripts/prepare_finance100_production.py --out-dir _production
      - name: Upload production handoff bundle (NOT approved media)
        uses: actions/upload-artifact@v4
        with:
          name: finance100-production-handoff
          path: _production/
          retention-days: 30
      - name: Build static site
        run: python scripts/build_site.py --out-dir _site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
